<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Hent vandstandsserier fra DMP</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        /* --- DARK MODE THEME & TYPOGRAPHY --- */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        
        .container { 
            max-width: 1600px; 
            margin: 0 auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 4px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #333;
        }

        h2, h3 { margin-top: 0; color: #ffffff; font-weight: 600; }
        h3 { font-size: 1.1em; margin-top: 20px; margin-bottom: 10px; color: #bbb; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        /* --- CONTROLS --- */
        .controls { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 20px; 
            background: #252526; 
            padding: 20px; 
            border-radius: 4px; 
            border: 1px solid #333;
        }
        .full-width { grid-column: 1 / -1; }
        
        label { 
            font-size: 0.85em; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            color: #aaa; 
            margin-bottom: 6px; 
            display: block; 
            font-weight: 600;
        }
        
        input[type="text"], input[type="date"] { 
            width: 100%; 
            padding: 10px; 
            background-color: #333; 
            border: 1px solid #444; 
            border-radius: 3px; 
            color: #fff; 
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        
        /* --- BUTTONS --- */
        .btn-group { display: flex; gap: 15px; margin-top: 5px; }
        
        button { 
            padding: 12px 24px; 
            cursor: pointer; 
            border: none; 
            border-radius: 3px; 
            font-weight: 600; 
            font-size: 0.9em; 
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }
        
        #btnFetch { background-color: #0078d4; color: white; }
        #btnDownload { background-color: #2ea043; color: white; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        
        /* --- TABLE & GRAPH --- */
        .table-container { max-height: 350px; overflow-y: auto; border: 1px solid #333; background-color: #1e1e1e; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th { background-color: #2d2d2d; color: #ddd; position: sticky; top: 0; padding: 10px; text-align: left; border-bottom: 2px solid #444; z-index: 2; }
        td { padding: 8px 10px; border-bottom: 1px solid #333; color: #ccc; }
        #graph-container { width: 100%; height: 600px; border: 1px solid #333; margin-top: 20px; background: #1e1e1e; }
        #debug-log { margin-top: 20px; padding: 15px; background: #000; color: #00ff41; font-family: monospace; font-size: 0.8em; border: 1px solid #333; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hent vandstandsserier fra DMP</h2>
    
    <div class="controls">
        <div class="full-width">
            <label>Station</label>
            <input type="text" list="stationList" id="stationInput" placeholder="Søg efter station..." disabled>
            <datalist id="stationList"></datalist>
            <input type="hidden" id="selectedStationId">
            <input type="hidden" id="selectedStationName">
        </div>

        <div>
            <label>Start Dato</label>
            <input type="date" id="startDate">
        </div>
        <div>
            <label>Slut Dato</label>
            <input type="date" id="endDate">
        </div>

        <div class="full-width">
            <div class="checkbox-container">
                <input type="checkbox" id="checkVeg" checked>
                <label for="checkVeg" style="margin-bottom: 0; text-transform: none;">Vis Vegetationsindeks (Højre y-akse)</label>
            </div>
        </div>

        <div class="full-width btn-group">
            <button id="btnFetch" onclick="runDataFetch()" disabled>Hent data fra DMP</button>
            <button id="btnDownload" onclick="downloadData()" disabled>Download vandstandsserie</button>
        </div>
    </div>

    <div id="graph-container"></div>

    <h3>Vandstand tabel</h3>
    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Tidspunkt (UTC)</th>
                    <th>Værdi (cm)</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="3" style="color:#777; font-style:italic;">Ingen data hentet endnu.</td></tr>
            </tbody>
        </table>
    </div>

    <h3>Log</h3>
    <div id="debug-log">System klar...</div>
</div>

<script>
    function log(msg) {
        const d = new Date();
        const time = d.toLocaleTimeString('da-DK', { hour12: false });
        const logDiv = document.getElementById('debug-log');
        logDiv.innerText = `[${time}] ${msg}\n` + logDiv.innerText;
    }

    let globalMeasurements = []; 
    let globalLogs = []; 
    let globalStaff = []; 
    let globalVeg = []; 
    let stationsMap = {};

    window.addEventListener('DOMContentLoaded', async () => {
        const today = new Date();
        const start = new Date("2025-01-01");
        document.getElementById('startDate').value = start.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];

        try {
            const resp = await fetch("https://vandah.miljoeportal.dk/api/stations");
            const allStations = await resp.json();
            const filtered = allStations.filter(s => (s.locationType || "").toLowerCase() === 'vandløb' && (s.stationOwnerName || "").toLowerCase().includes('miljøstyrelsen'));
            
            const datalist = document.getElementById('stationList');
            filtered.forEach(s => {
                const label = `${s.name} (${s.stationId})`;
                const option = document.createElement('option');
                option.value = label; 
                datalist.appendChild(option);
                stationsMap[label] = { id: s.stationId, name: s.name };
            });

            document.getElementById('stationInput').disabled = false;
            document.getElementById('btnFetch').disabled = false;
            log("Stationer indlæst.");
        } catch (e) { log("FEJL: " + e.message); }
    });

    document.getElementById('stationInput').addEventListener('input', function() {
        if (stationsMap[this.value]) {
            document.getElementById('selectedStationId').value = stationsMap[this.value].id;
            document.getElementById('selectedStationName').value = stationsMap[this.value].name;
        }
    });

    async function runDataFetch() {
        const stationId = document.getElementById('selectedStationId').value || document.getElementById('stationInput').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        if (!stationId) { alert("Vælg en station!"); return; }

        const btnFetch = document.getElementById('btnFetch');
        btnFetch.disabled = true;
        btnFetch.innerText = "Arbejder...";
        
        const fromStr = `${start}T00:00Z`;
        const toStr = `${end}T23:59Z`;
        
        const urlWater = `https://vandah.miljoeportal.dk/api/water-levels?stationId=${stationId}&from=${fromStr}&to=${toStr}`;
        const urlLogs = `https://vandah.miljoeportal.dk/api/stations/logs?stationId=${stationId}&from=${fromStr}&to=${toStr}`;
        const urlStaff = `https://vandah.miljoeportal.dk/api/measurements/results/current?stationId=${stationId}&examinationTypeSc=22&from=${fromStr}&to=${toStr}`;
        const urlVeg = `https://vandah.miljoeportal.dk/api/measurements/results/current?stationId=${stationId}&examinationTypeSc=24&from=${fromStr}&to=${toStr}`;

        try {
            const [respWater, respLogs, respStaff, respVeg] = await Promise.all([
                fetch(urlWater), fetch(urlLogs), fetch(urlStaff), fetch(urlVeg)
            ]);

            if (respWater.ok) {
                const json = await respWater.json();
                globalMeasurements = json.flatMap(s => s.results || []).sort((a,b) => new Date(a.measurementDateTime) - new Date(b.measurementDateTime));
            }
            if (respLogs.ok) {
                const json = await respLogs.json();
                globalLogs = Array.isArray(json) ? json : (json.results || []);
            }
            if (respStaff.ok) {
                const json = await respStaff.json();
                globalStaff = json.flatMap(s => s.results || []);
            }
            if (respVeg.ok) {
                const json = await respVeg.json();
                globalVeg = json.flatMap(s => s.results || []).filter(r => r.vegetationIndex !== undefined && r.vegetationIndex !== null);
            }

            log(`Hentet: ${globalMeasurements.length} vandstand, ${globalLogs.length} logs.`);
            updateTable(globalMeasurements);
            drawGraph(globalMeasurements, globalLogs, globalStaff, globalVeg);
            document.getElementById('btnDownload').disabled = false;

        } catch (e) { log(`FEJL: ${e.message}`); }
        finally {
            btnFetch.disabled = false;
            btnFetch.innerText = "Hent data fra DMP";
        }
    }

    function updateTable(data) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = data.length === 0 ? "<tr><td colspan='3'>Ingen data.</td></tr>" : "";
        data.slice(0, 500).forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${r.measurementDateTime}</td><td>${r.result}</td><td>${r.examinationType || '-'}</td>`;
            tbody.appendChild(tr);
        });
    }

    function drawGraph(measurements, logs, staffData, vegData) {
        const xWater = [];
        const yWater = [];
        let maxVal = -9999, minVal = 9999;

        measurements.forEach(d => {
            if (d.measurementDateTime && d.result !== undefined) {
                xWater.push(d.measurementDateTime);
                yWater.push(d.result);
                if(d.result > maxVal) maxVal = d.result;
                if(d.result < minVal) minVal = d.result;
            }
        });
        
        const xStaff = [];
        const yStaff = [];
        const tStaff = [];
        staffData.forEach(s => {
            if (s.measurementDateTime && s.result !== undefined) {
                xStaff.push(s.measurementDateTime);
                yStaff.push(s.result);
                if(s.result > maxVal) maxVal = s.result;
                if(s.result < minVal) minVal = s.result;
                tStaff.push(`Skalaaflæsning: ${s.result} cm<br>${new Date(s.measurementDateTime).toLocaleString('da-DK')}`);
            }
        });
        
        if (measurements.length === 0 && staffData.length === 0) { maxVal = 100; minVal = 0; }
        const rangeSpan = maxVal - minVal;

        const logShapes = [];
        const logMarkersX = [];
        const logMarkersY = [];
        const logTexts = [];

        const sortedLogs = [...logs].sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
        const TIME_THRESHOLD_MS = 12 * 60 * 60 * 1000; 
        let currentGroupTime = 0;
        let groupCount = 0;

        sortedLogs.forEach(l => {
            const time = l.dateTime; 
            if (time) {
                const logTimeMs = new Date(time).getTime();
                const activity = l.activityTxt || "Ukendt aktivitet";
                const comment = l.comment; 
                let displayText = `<b>${activity}</b>`;
                if (comment) displayText += `<br>${comment}`;

                if (Math.abs(logTimeMs - currentGroupTime) < TIME_THRESHOLD_MS) {
                    groupCount++;
                } else {
                    currentGroupTime = logTimeMs;
                    groupCount = 0;
                }

                logShapes.push({
                    type: 'line',
                    x0: time, y0: minVal - (rangeSpan * 0.05),
                    x1: time, y1: maxVal + (rangeSpan * 0.05),
                    line: { color: '#ff4d4d', width: 1, dash: 'dashdot' }
                });

                const offsetStep = rangeSpan > 0 ? rangeSpan * 0.08 : 10;
                const currentY = maxVal - (groupCount * offsetStep);

                logMarkersX.push(time);
                logMarkersY.push(currentY); 
                logTexts.push(displayText);
            }
        });

        const traces = [];
        if (xWater.length > 0) traces.push({ x: xWater, y: yWater, type: 'scatter', mode: 'lines', line: {color: '#4aa3df', width: 1}, name: 'Vandstand' });
        if (xStaff.length > 0) traces.push({ x: xStaff, y: yStaff, type: 'scatter', mode: 'markers', marker: { color: '#00e676', size: 10, symbol: 'circle', line: {color: '#000', width: 1} }, text: tStaff, hoverinfo: 'text', name: 'Skalaaflæsning' });

        const showVeg = document.getElementById('checkVeg').checked;
        if (showVeg && vegData.length > 0) {
            traces.push({
                x: vegData.map(d => d.measurementDateTime),
                y: vegData.map(d => d.vegetationIndex),
                name: 'Vegetationsindeks', type: 'scatter', mode: 'markers+lines', yaxis: 'y2',
                line: { color: '#ffa726', dash: 'dot', width: 1 }, marker: { color: '#ffa726', size: 8, symbol: 'diamond' }
            });
        }

        if (logMarkersX.length > 0) {
            traces.push({
                x: logMarkersX, y: logMarkersY,
                mode: 'markers',
                marker: { color: '#ff4d4d', size: 12, symbol: 'triangle-down' },
                text: logTexts,
                hoverinfo: 'text+x',
                name: 'Logbog'
            });
        }

        const layout = {
            title: { text: document.getElementById('selectedStationName').value || 'Vandstand', font: { color: '#fff' } },
            margin: { t: 40, r: 60, l: 60, b: 40 },
            paper_bgcolor: '#1e1e1e', plot_bgcolor: '#1e1e1e', font: { color: '#e0e0e0' },
            xaxis: { title: 'Tid (UTC)', gridcolor: '#333' }, 
            yaxis: { title: 'Vandstand (cm)', gridcolor: '#333' },
            yaxis2: { title: 'Vegetationsindeks', overlaying: 'y', side: 'right', showgrid: false, font: { color: '#ffa726' }, titlefont: { color: '#ffa726' } },
            shapes: logShapes,
            hovermode: 'closest',
            legend: { bgcolor: 'rgba(30,30,30,0.8)', bordercolor: '#444', borderwidth: 1 }
        };

        Plotly.newPlot('graph-container', traces, layout);
    }

    function downloadData() {
        if (!globalMeasurements.length) return;
        
        const stationId = document.getElementById('selectedStationId').value;
        const stationName = document.getElementById('selectedStationName').value;
        
        log(`Genererer fil...`);
        
        let content = "Dato_UTC\tDato_UTC+1\tVandstand\tEnhed\tStations_nr\tStations_navn\n";

        function formatDateStruct(y, m, d, h, min, s) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${y}${pad(m)}${pad(d)}${pad(h)}${pad(min)}${pad(s)}`;
        }

        globalMeasurements.forEach(row => {
            const val = row.result;
            const ts = row.measurementDateTime; 
            
            if (ts) {
                const d = new Date(ts);
                
                // UTC
                const utcStr = formatDateStruct(
                    d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(),
                    d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()
                );

                // Dansk Normaltid (UTC+1)
                const dNorm = new Date(d.getTime() + (3600 * 1000));
                const normStr = formatDateStruct(
                    dNorm.getUTCFullYear(), dNorm.getUTCMonth() + 1, dNorm.getUTCDate(),
                    dNorm.getUTCHours(), dNorm.getUTCMinutes(), dNorm.getUTCSeconds()
                );

                content += `${utcStr}\t${normStr}\t${val}\tcm\t${stationId}\t${stationName}\n`;
            }
        });

        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        link.href = url;
        link.download = `vandstand_${stationId}_${start}_${end}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
